<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Luke AFB Bagger Queue</title>
  <meta property="og:title" content="Luke AFB Bagger Queue" />
  <meta property="og:description" content="Live queue for who's on a register and who's next in line." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Luke AFB Bagger Queue" />
  <!-- Bump this string on every deploy. A tab left open (e.g. on a register)
       polls for this to change and auto-reloads, so it can never keep running
       old logic (missed bug fixes, missing features) indefinitely. -->
  <meta name="app-version" content="2026-08-17-11" />
  <!-- Lets a phone "Add to Home Screen" this as a real app icon, instead of a
       plain browser bookmark. Deliberately no service worker here — a
       misconfigured service worker cache is exactly the kind of thing that
       could serve stale code forever, which is a mistake this app has
       already been burned by once this session (see baggerqueue.web.app
       history) — not worth the risk for what's otherwise just a cosmetic
       upgrade. "Add to Home Screen" from the browser menu works fine without one. -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Bagger Queue" />
  <meta name="theme-color" content="#0066cc" />
  <style>
    :root{--bg:#f7f8fa;--card:#ffffff;--muted:#6b7280;--accent:#0066cc;--danger:#d9534f}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#111;background:var(--bg);display:flex;flex-direction:column}

    /* Top sticky bar */
    .topbar{position:sticky;top:0;background:var(--card);padding:12px 16px;border-bottom:1px solid #e6e9ee;display:flex;align-items:center;justify-content:space-between;z-index:10}
    .topbar .user{display:flex;align-items:center;gap:12px;width:100%}
    .avatar{width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,#e6f0ff,#fff);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:1.1rem;cursor:pointer;position:relative}
    .avatar::after{content:'✎';position:absolute;bottom:-4px;right:-4px;background:#fff;border:1px solid #e6e9ee;border-radius:50%;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
    .who .icon-prefix{margin-right:4px}
    .user-info{flex:1}
    .username{font-size:1.05rem;font-weight:600}
    .status{color:var(--muted);font-size:0.9rem}
    .topbar button{background:transparent;border:none;color:var(--danger);font-weight:600}
    .topbar #muteBtn{color:var(--muted);font-size:1.1rem;font-weight:400;padding:4px}

    /* Main scroll area */
    .content{flex:1;overflow:auto;padding:12px}
    .group{margin-bottom:16px}
    .group h3{margin:6px 4px;color:var(--muted);font-size:0.95rem}
    .list{background:var(--card);border-radius:8px;overflow:hidden;border:1px solid #e6e9ee}
    .row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #f1f5f9}
    .row:last-child{border-bottom:none}
    .row .left{display:flex;align-items:center;gap:12px}
    .row .who{font-weight:600}
    .row .meta{color:var(--muted);font-size:0.85rem}
    .row button{background:transparent;border:none;color:var(--accent);font-weight:600}
    .pending{opacity:0.5}
    .countdown{color:var(--muted);font-size:0.9rem;margin-left:8px}
    .admin-tag{color:var(--accent);font-weight:600}
    .skip-tag{color:var(--danger);font-weight:600}

    /* Bottom sticky action bar */
    .bottombar{position:sticky;bottom:0;background:var(--card);padding:12px;display:flex;gap:8px;border-top:1px solid #e6e9ee;flex-wrap:wrap}
    .btn{flex:1;min-width:100px;padding:12px;border-radius:8px;border:none;font-weight:700;font-size:0.95rem}
    .btn.primary{background:var(--accent);color:white}
    .btn.secondary{background:#f1f5f9;color:#111}

    /* Name / password / closed screen */
    .name-screen{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:20px}
    input[type=text],input[type=password]{padding:14px;border-radius:10px;border:1px solid #e6e9ee;font-size:1rem}
    .center{display:flex;justify-content:center}
    .error{color:var(--danger);font-size:0.9rem;min-height:1.2em}

    /* Modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:50}
    .modal{background:white;padding:16px;border-radius:10px;max-width:400px;width:92%;box-shadow:0 6px 30px rgba(0,0,0,0.2)}
    .modal h4{margin:0 0 8px}
    .modal p{color:var(--muted);margin:0 0 12px}
    .modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

    /* small helpers */
    .muted{color:var(--muted)}
    @media(min-width:720px){.row{padding:14px 18px}.avatar{width:56px;height:56px}}

  <div id="bottomBar" class="bottombar" style="display:none">
    <button id="toRegisterBtn" class="btn primary">Move to Register</button>
    <button id="toEndBtn" class="btn secondary">Move to End of Line</button>
    <button id="toBreakBtn" class="btn secondary">Take a Break</button>
  </div>

  <!-- Modal container -->
  <div id="modalRoot"></div>

  <script>
    // Auto-reload if a newer version has been deployed. A tab left open on a
    // register indefinitely would otherwise keep running whatever code was
    // live when it first loaded — including missing any future bug fixes.
    const CURRENT_VERSION = document.querySelector('meta[name="app-version"]').content;
    async function checkForUpdate(){
      try {
        const res = await fetch(location.pathname, { cache: 'no-store' });
        const text = await res.text();
        const m = text.match(/name="app-version" content="([^"]+)"/);
        if (m && m[1] && m[1] !== CURRENT_VERSION) location.reload();
      } catch (e) { /* offline or blocked; try again next interval */ }
    }
    setInterval(checkForUpdate, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });

    // App config
    const CLEANUP_INTERVAL = 5000; // ms to check for expired pending removals
    const COUNTDOWN_UPDATE = 1000; // update countdown every second
    const PENDING_DELAY = 10 * 60 * 1000; // 10 minutes in ms

    // The join password now lives in the database (siteStatus/password) so the
    // admin panel can change it without a code deploy. It's still only ever
    // checked in the browser (this is a static site with no server), so it
    // keeps casual customers out but is not real security — same as before.
    // This fallback is only used before the live value has arrived, or if the
    // admin panel has never explicitly set one yet.
    let currentPassword = 'bagger!';
    let passwordKnown = false;

    // Local storage keys
    const LS_CLIENT = 'comm_clientId';
    const LS_NAME = 'comm_name';
    const LS_BAGGER_NUMBER = 'comm_bagger_number';
    const LS_AUTH = 'comm_auth';
    const LS_AUTH_VERSION = 'comm_auth_version';

    // UI elements
    const closedScreen = document.getElementById('closedScreen');
    const passwordScreen = document.getElementById('passwordScreen');
    const passwordInput = document.getElementById('passwordInput');
    const passwordBtn = document.getElementById('passwordBtn');
    const passwordError = document.getElementById('passwordError');
    const nameScreen = document.getElementById('nameScreen');
    const queueScreen = document.getElementById('queueScreen');
    const topbar = document.getElementById('topbar');
    const bottomBar = document.getElementById('bottomBar');
    const nameInput = document.getElementById('nameInput');
    const baggerNumberInput = document.getElementById('baggerNumberInput');
    const joinBtn = document.getElementById('joinBtn');
    const avatarEl = document.getElementById('avatar');
    const meNameEl = document.getElementById('meName');
    const meStatusEl = document.getElementById('meStatus');
    const leaveBtn = document.getElementById('leaveBtn');
    const muteBtn = document.getElementById('muteBtn');
    const registerList = document.getElementById('registerList');
    const lineList = document.getElementById('lineList');
    const breakList = document.getElementById('breakList');
    const toRegisterBtn = document.getElementById('toRegisterBtn');
    const toEndBtn = document.getElementById('toEndBtn');
    const toBreakBtn = document.getElementById('toBreakBtn');
    const modalRoot = document.getElementById('modalRoot');

    // State
    let clientId = localStorage.getItem(LS_CLIENT) || null;
    let myName = localStorage.getItem(LS_NAME) || '';
    let myBaggerNumber = localStorage.getItem(LS_BAGGER_NUMBER) || '';
    let people = {}; // {id: {name,baggerNumber,status,ts,pendingRemovalAt,order,movedByAdmin}}
    let meWatchRef = null; // live ref watching our own entry, re-pointed if we reclaim a different id
    let siteEnabled = true; // live-updated from DB; admin can flip this off to close the queue
    let appStarted = false;
    // "Log everyone out" support: admin can bump siteStatus/authVersion, which
    // invalidates every browser's saved password-auth flag, even ones that were
    // already past the password screen — a plain password change alone can't
    // do that, since a browser that already unlocked never re-checks it.
    let authVersion = null;
    let enabledKnown = false;
    let authVersionKnown = false;

    // Status-change alerts (spot #1/#2 in line, or moved by an admin). Tracks
    // the last state we alerted on so we only fire on an actual transition,
    // not on every snapshot — and a "baseline" flag so loading the page while
    // already in spot #1 doesn't fire a spurious alert on first load.
    let notifyBaselineSet = false;
    let lastNotifyPos = null;
    let lastNotifyMovedByAdmin = false;

    // Initialize local client id if missing
    if (!clientId) {
      if (window.crypto && crypto.randomUUID) clientId = crypto.randomUUID();
      else clientId = 'c-' + Date.now() + '-' + Math.floor(Math.random()*10000);
      localStorage.setItem(LS_CLIENT, clientId);
    }

    // Pre-fill name/bagger number inputs if stored
    if (myName) nameInput.value = myName;
    if (myBaggerNumber) baggerNumberInput.value = myBaggerNumber;

    // Initialize Firebase (kept as placeholder earlier)
    try {
      firebase.initializeApp(firebaseConfig);
      window.db = firebase.database();
    } catch (e) {
      // If firebaseConfig is placeholder the SDK will throw here; that's expected until you add real config
      console.warn('Firebase init failed (placeholders likely):', e.message);
      window.db = null;
    }

    // Log an event to the shared activity log the admin panel displays. Fire-and-forget.
    function logActivity(type, name){
      if (!db) return;
      db.ref('activityLog').push({ type, name, ts: firebase.database.ServerValue.TIMESTAMP }).catch(()=>{});
    }

    // Utility: show modal
    function showModal(title, message, actions=[]) {
      modalRoot.innerHTML = `\n        <div class=\"modal-backdrop\">\n          <div class=\"modal\">\n            <h4>${escapeHtml(title)}</h4>\n            <p>${escapeHtml(message)}</p>\n            <div class=\"actions\">\n            </div>\n          </div>\n        </div>`;
      const actionsEl = modalRoot.querySelector('.actions');
      actions.forEach(a => {
        const b = document.createElement('button');
        b.textContent = a.label;
        b.className = a.className || '';
        b.onclick = () => { a.onClick(); modalRoot.innerHTML = ''; };
        actionsEl.appendChild(b);
      });
    }

    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}

    // Accepts either up to 2 plain letters, or exactly one emoji (which can
    // itself be several UTF-16 code units — flags, skin tones, etc. — so this
    // counts actual visual characters via Intl.Segmenter rather than string
    // length). Anything else (multiple emoji, random symbols, 3+ letters) is
    // rejected so the icon field can't be turned into extra text.
    function isSingleEmoji(s){
      if (!s) return false;
      if (typeof Intl !== 'undefined' && Intl.Segmenter) {
        try {
          const seg = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
          return Array.from(seg.segment(s)).length === 1;
        } catch(e) { /* fall through to the rough fallback below */ }
      }
      return s.length >= 1 && s.length <= 8; // best effort on very old browsers
    }

    function showIconEditor(){
      const me = people[clientId];
      if (!me) return;
      const current = me.icon || '';
      modalRoot.innerHTML = `
        <div class="modal-backdrop">
          <div class="modal">
            <h4>Choose your icon</h4>
            <p class="muted" style="margin:0 0 10px">Enter an emoji, or up to 2 letters.</p>
            <input id="iconInput" type="text" value="${escapeHtml(current)}" maxlength="8" style="padding:12px;border-radius:8px;border:1px solid #e6e9ee;font-size:1.3rem;text-align:center;width:100%;box-sizing:border-box" />
            <div id="iconError" class="error"></div>
            <div class="actions" style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px">
              <button id="iconClearBtn" class="btn secondary">Use initials</button>
              <button id="iconCancelBtn" class="btn secondary">Cancel</button>
              <button id="iconSaveBtn" class="btn primary">Save</button>
            </div>
          </div>
        </div>`;
      const input = document.getElementById('iconInput');
      const err = document.getElementById('iconError');
      input.focus(); input.select();
      document.getElementById('iconCancelBtn').onclick = () => { modalRoot.innerHTML = ''; };
      document.getElementById('iconClearBtn').onclick = async () => {
        modalRoot.innerHTML = '';
        if (people[clientId]) await myDbRef().update({ icon: null });
      };
      const save = async () => {
        const val = input.value.trim();
        if (!val) { err.textContent = 'Type an emoji or up to 2 letters.'; return; }
        let toSave;
        if (/^[A-Za-z]{1,2}$/.test(val)) {
          toSave = val.toUpperCase();
        } else if (isSingleEmoji(val)) {
          toSave = val;
        } else {
          err.textContent = 'Please enter one emoji, or up to 2 letters.';
          return;
        }
        modalRoot.innerHTML = '';
        if (people[clientId]) await myDbRef().update({ icon: toSave });
      };
      document.getElementById('iconSaveBtn').onclick = save;
      input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
    }

    // Turn a typed name into a Firebase-key-safe, case-insensitive identifier.
    // Used to look people up in the blockedNames list. Must match the logic
    // used in admin.html exactly, or blocking won't line up.
    function sanitizeKey(s){ return String(s||'').trim().toLowerCase().replace(/[.#$\[\]\/]/g, '_'); }

    // DB helpers
    function peopleRef(){ return db.ref('people'); }
    function myDbRef(){ return db.ref('people/' + clientId); }

    // (Re)attach the listener that watches our own entry, e.g. to detect someone
    // else removing us, or auto-removal once a pending timer expires. Needs to be
    // re-pointed whenever clientId changes (e.g. after reclaiming an entry by name).
    function watchMe(){
      if (meWatchRef) { try { meWatchRef.off(); } catch(e){} }
      meWatchRef = myDbRef();
      meWatchRef.on('value', snap => {
        if (!snap.exists()) {
          if (siteEnabled === false) return; // closed-screen flow already handles this case
          if (queueScreen.style.display==='block') { alert('You were removed from the queue'); gotoNameScreen(); }
        }
      });
    }

    async function joinLine() {
      if (!db) { alert('Realtime DB not configured yet. Paste firebaseConfig in the page.'); return; }
      if (siteEnabled === false) { showClosedScreen(); return; }
      myName = nameInput.value.trim();
      myBaggerNumber = baggerNumberInput.value.trim();
      if (!myName) { alert('Type your name'); return; }
      if (!myBaggerNumber) { alert('Enter your bagger number'); return; }
      if (!/^[0-9]{1,3}$/.test(myBaggerNumber)) { alert('Bagger number must be numbers only, up to 3 digits'); return; }

      // Check the block list, and look up any existing entry with this name (for
      // the reclaim flow below), in one parallel round trip. Doing these together
      // instead of sequentially shrinks — but does not fully close — the window
      // where an admin block and a join could race each other. The admin panel
      // also runs a continuous self-healing check that re-removes anyone who
      // slips through this window, so a slipped-through join doesn't stick.
      const nameKey = sanitizeKey(myName);
      const [blockedNameSnap, blockedClientSnap, peopleSnap] = await Promise.all([
        db.ref('blockedNames/' + nameKey).once('value'),
        db.ref('blockedClients/' + clientId).once('value'),
        peopleRef().once('value')
      ]);
      if (blockedNameSnap.exists() || blockedClientSnap.exists()) {
        alert('You are unable to join the queue. Please see a staff member.');
        return;
      }

      localStorage.setItem(LS_NAME, myName);
      localStorage.setItem(LS_BAGGER_NUMBER, myBaggerNumber);

      // If someone with this name AND bagger number already has an entry (e.g.
      // they lost their local identity by opening the site in a new browser/tab),
      // reclaim that entry instead of creating a duplicate that would need a
      // 10 minute timer to clear. Matching on both fields (not just name) avoids
      // two different baggers who happen to share a first name reclaiming each
      // other's spot in line.
      const all = peopleSnap.val() || {};
      let existingId = null;
      Object.keys(all).forEach(id => {
        const v = all[id];
        if (v && v.name && v.name.trim().toLowerCase() === myName.toLowerCase() && (v.baggerNumber || '') === myBaggerNumber) existingId = id;
      });

      if (existingId) {
        clientId = existingId;
        localStorage.setItem(LS_CLIENT, clientId);
        if (all[existingId].pendingRemovalAt) {
          await peopleRef().child(existingId + '/pendingRemovalAt').remove();
        }
      } else {
        const data = { name: myName, baggerNumber: myBaggerNumber, status: 'line', ts: firebase.database.ServerValue.TIMESTAMP, pendingRemovalAt: null, movedByAdmin: false };
        await myDbRef().set(data);
      }

      watchMe();
      setupListeners();
      showQueueScreen();
    }

    async function leaveQueueConfirmed() {
      if (!db) return gotoNameScreen();
      const me = people[clientId];
      await myDbRef().remove();
      if (me && me.name) logActivity('self_leave', me.name);
      gotoNameScreen();
    }

    function gotoNameScreen(){
      topbar.style.display='none';
      bottomBar.style.display='none';
      queueScreen.style.display='none';
      nameScreen.style.display='block';
    }
    function showQueueScreen(){
      nameScreen.style.display='none';
      queueScreen.style.display='block';
      topbar.style.display='flex';
      bottomBar.style.display='flex';
    }

    function showClosedScreen(){
      passwordScreen.style.display='none';
      nameScreen.style.display='none';
      queueScreen.style.display='none';
      topbar.style.display='none';
      bottomBar.style.display='none';
      closedScreen.style.display='block';
    }

    // Render one section's rows into `container`. `timeLabel` distinguishes the
    // "since HH:MM" vs "Joined: HH:MM" phrasing already used per section.
    function renderGroup(container, arr, emptyText, timeLabel){
      container.innerHTML = '';
      if (arr.length === 0) { container.innerHTML = `<div class="row"><div class="left"><div class="who muted">${emptyText}</div></div></div>`; return; }
      arr.forEach((p, idx) => {
        const r = document.createElement('div'); r.className='row';
        const adminTag = p.movedByAdmin ? ' <span class="admin-tag">(Moved by admin)</span>' : '';
        const posTag = timeLabel === 'Joined:' ? `<div class=\"meta\">#${idx+1}</div>` : '';
        const iconPrefix = p.icon ? `<span class=\"icon-prefix\">${escapeHtml(p.icon)}</span>` : '';
        // Only the person at the front of the line can have been "skipped" —
        // someone else called to a register while they were still waiting.
        const skipTag = (timeLabel === 'Joined:' && idx === 0 && p.skippedCount) ? ` <span class=\"skip-tag\">(Skipped ${p.skippedCount}x)</span>` : '';
        const numberTag = p.baggerNumber ? ` (${escapeHtml(p.baggerNumber)})` : '';
        r.innerHTML = `<div class=\"left\"><div style=\"display:flex;align-items:center;gap:8px\"><div class=\"who\">${iconPrefix}${escapeHtml(p.name)}${numberTag}${skipTag}</div>${posTag}</div><div class=\"meta\">${timeLabel} ${timeAgo(p.ts)}${adminTag}</div></div><div class=\"right\"></div>`;
        r.onclick = ()=> onRowClick(p.id);
        if (p.pendingRemovalAt) r.classList.add('pending');
        if (p.pendingRemovalAt) {
          const cd = document.createElement('div'); cd.className='countdown'; cd.dataset.for = p.id; r.querySelector('.right').appendChild(cd);
        }
        if (p.id===clientId) r.style.background='#f8fbff';
        container.appendChild(r);
      });
    }

    // Render UI from people state
    function render() {
      // build arrays
      const regs = [], line = [], brk = [];
      Object.keys(people).forEach(id => {
        const p = people[id];
        if (!p) return;
        if (p.status === 'register') regs.push({id, ...p});
        else if (p.status === 'break') brk.push({id, ...p});
        else line.push({id, ...p});
      });
      // sort by admin-assigned "order" when present (drag-and-drop in the admin
      // panel writes this), falling back to join time otherwise.
      const sortKey = p => (p.order != null ? p.order : (p.ts || 0));
      regs.sort((a,b)=> sortKey(a)-sortKey(b));
      line.sort((a,b)=> sortKey(a)-sortKey(b));
      brk.sort((a,b)=> sortKey(a)-sortKey(b));

      // topbar current user
      const me = people[clientId];
      if (me) {
        avatarEl.textContent = me.icon || (me.name||'').slice(0,2).toUpperCase();
        meNameEl.textContent = me.name ? (me.name + (me.baggerNumber ? ` (${me.baggerNumber})` : '')) : 'You';
        let statusText = '';
        if (me.status === 'register') statusText = 'At the register';
        else if (me.status === 'break') statusText = 'On break';
        else {
          const pos = line.findIndex(p=>p.id===clientId);
          statusText = pos>=0 ? `#${pos+1} in line` : 'In line';
        }
        if (me.pendingRemovalAt) statusText += ' · tap your name below to cancel removal';
        meStatusEl.textContent = statusText;
      }

      // Fire a status-change alert on an actual transition into spot #1/#2 in
      // line, or the moment an admin moves this person. Only after the first
      // baseline is captured, so loading the page already in spot #1 doesn't
      // alert immediately.
      if (me) {
        let posBucket = null;
        if (me.status === 'line') {
          const pos = line.findIndex(p=>p.id===clientId) + 1; // 1-indexed
          if (pos === 1 || pos === 2) posBucket = pos;
        }
        const movedByAdminNow = !!me.movedByAdmin;
        if (!notifyBaselineSet) {
          lastNotifyPos = posBucket;
          lastNotifyMovedByAdmin = movedByAdminNow;
          notifyBaselineSet = true;
        } else {
          if (posBucket && posBucket !== lastNotifyPos) {
            notifyUser(
              posBucket === 1 ? "You're next!" : "You're #2 in line!",
              'Head toward the registers — you\'ll be called soon.'
            );
          }
          if (movedByAdminNow && !lastNotifyMovedByAdmin) {
            const where = me.status === 'register' ? 'at the register' : me.status === 'break' ? 'on break' : 'in line';
            notifyUser('An admin moved you', `You're now ${where}.`);
          }
          lastNotifyPos = posBucket;
          lastNotifyMovedByAdmin = movedByAdminNow;
        }
      } else {
        notifyBaselineSet = false; // reset so rejoining later re-seeds cleanly
      }

      renderGroup(registerList, regs, 'No one at registers', 'since');
      renderGroup(lineList, line, 'No one in line', 'Joined:');
      renderGroup(breakList, brk, 'No one on break', 'since');

      // show top/bottom if me present
      if (me) { topbar.style.display='flex'; bottomBar.style.display='flex'; }
      else { topbar.style.display='none'; bottomBar.style.display='none'; }
    }

    function timeAgo(ts){ if(!ts) return ''; const d = new Date(ts); return d.toLocaleTimeString(); }

    // Status-change alert: a short chime + in-page banner (works on every
    // platform whenever this tab is open) plus a real OS notification when
    // permission has been granted and the browser supports it. On desktop and
    // Android that OS notification lands in the actual notification center
    // even if this tab is backgrounded. On iPhone Safari, a plain website tab
    // can't do that at all (Apple only allows it for a home-screen-installed
    // app with real push infrastructure, which this static site doesn't
    // have) — the chime/banner is the fallback for that case, but only while
    // the tab itself is open and visible.
    const LS_MUTE = 'comm_mute_sound';
    let soundMuted = localStorage.getItem(LS_MUTE) === 'true';
    function playChime(){
      if (soundMuted) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.18;
        o.start();
        o.stop(ctx.currentTime + 0.28);
      } catch(e) { /* audio blocked until a user gesture on this page; harmless */ }
    }
    function showToast(message){
      const t = document.createElement('div');
      t.textContent = message;
      t.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);max-width:88%;text-align:center;background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:0.9rem;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,0.25)';
      document.body.appendChild(t);
      setTimeout(()=>{ t.remove(); }, 4500);
    }
    function notifyUser(title, body){
      playChime();
      showToast(title);
      if (window.Notification && Notification.permission === 'granted') {
        try { new Notification(title, { body, tag: 'queue-status' }); } catch(e) {}
      }
    }

    // clicking a row: if it's me -> cancel my own timer or leave; else -> set pendingRemovalAt or cancel
    // (deliberately: this is the ONLY way another person's row can be acted on from
    // here — there is no "move someone else to break" option, by design: only the
    // person themselves can put themselves on break, via the bottom bar button.)
    function onRowClick(id) {
      const p = people[id]; if(!p) return;
      if (id === clientId) {
        if (p.pendingRemovalAt) {
          showModal('Removal timer running', `You have a removal timer running. You can cancel it to stay in the queue, or leave now.`, [
            {label:'Keep waiting', onClick:()=>{}},
            {label:'Cancel timer', className:'btn primary', onClick: async ()=> {
              await myDbRef().child('pendingRemovalAt').remove();
            }},
            {label:'Leave queue', className:'btn secondary', onClick:()=> leaveQueueConfirmed()}
          ]);
        } else {
          showModal('Leave queue', 'Remove yourself from the queue?', [
            {label:'Cancel', onClick:()=>{}},
            {label:'Leave', className:'btn primary', onClick:()=> leaveQueueConfirmed()}
          ]);
        }
        return;
      }

      // someone else
      if (p.pendingRemovalAt) {
        // offer cancel
        showModal('Cancel pending removal', `Cancel the pending removal for ${p.name}?`, [
          {label:'No', onClick:()=>{}},
          {label:'Cancel removal', className:'btn primary', onClick:async ()=> {
            await peopleRef().child(id + '/pendingRemovalAt').remove();
          }}
        ]);
      } else {
        // start pending removal (10 minutes)
        showModal('Start removal timer', `Start a 10 minute removal timer for ${p.name}?`, [
          {label:'No', onClick:()=>{}},
          {label:'Start', className:'btn primary', onClick:async ()=> {
            const when = Date.now() + PENDING_DELAY;
            await peopleRef().child(id).update({ pendingRemovalAt: when });
          }}
        ]);
      }
    }

    // Periodic cleanup: any entry with pendingRemovalAt <= now should be deleted.
    // Uses a per-node transaction so that if several open tabs all notice the same
    // expired entry at once, only the one whose write actually lands on the server
    // logs the event — otherwise a busy queue could log the same removal 3-4 times.
    async function cleanupExpired() {
      if (!db) return;
      const now = Date.now();
      const snap = await peopleRef().once('value');
      const toCheck = [];
      snap.forEach(child => {
        const v = child.val();
        if (v && v.pendingRemovalAt && Number(v.pendingRemovalAt) <= now) {
          toCheck.push({ id: child.key, name: v.name });
        }
      });
      for (const entry of toCheck) {
        const ref = peopleRef().child(entry.id);
        ref.transaction(current => {
          if (current && current.pendingRemovalAt && Number(current.pendingRemovalAt) <= Date.now()) {
            return null; // this call performs the delete
          }
          return undefined; // already gone (someone else's transaction won) or no longer expired — abort
        }, (error, committed) => {
          if (!error && committed) {
            logActivity('timer', entry.name);
            if (entry.id === clientId) {
              if (siteEnabled === false) return;
              alert('You were removed from the queue');
              gotoNameScreen();
            }
          }
        });
      }
    }

    // countdown updater: updates countdown displays for pending entries
    function updateCountdowns() {
      const els = document.querySelectorAll('.countdown');
      const now = Date.now();
      els.forEach(el => {
        const id = el.dataset.for; const p = people[id];
        if (!p || !p.pendingRemovalAt) { el.textContent = ''; return; }
        const rem = Math.max(0, Number(p.pendingRemovalAt) - now);
        const mm = Math.floor(rem/60000); const ss = Math.floor((rem%60000)/1000);
        el.textContent = `removes in ${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
      });
    }

    // setup Firebase listeners
    function setupListeners(){
      if (!db) return;
      const ref = peopleRef();
      ref.on('value', snap => {
        const val = snap.val() || {};
        people = val;
        render();
      });
    }

    // Move current user to register/line/break. Firebase's update() will silently
    // RE-CREATE a deleted node if it doesn't check first — guard against that so a
    // removed/blocked person's tab can't resurrect their entry just by tapping one
    // of these buttons. Also clears movedByAdmin, since this move is self-initiated.
    async function moveMeToRegister(){
      if(!db || !people[clientId]) return;
      await myDbRef().update({ status:'register', ts: firebase.database.ServerValue.TIMESTAMP, movedByAdmin: false });
      logActivity('self_move_register', myName);
    }
    async function moveMeToEnd(){
      if(!db || !people[clientId]) return;
      await myDbRef().update({ status:'line', ts: firebase.database.ServerValue.TIMESTAMP, movedByAdmin: false });
      logActivity('self_move_line', myName);
    }
    async function moveMeToBreak(){
      if(!db || !people[clientId]) return;
      await myDbRef().update({ status:'break', ts: firebase.database.ServerValue.TIMESTAMP, movedByAdmin: false });
      logActivity('self_move_break', myName);
    }

    // join by pressing button
    joinBtn.addEventListener('click', () => {
      // Ask for notification permission synchronously inside this click
      // handler (the click is the user gesture some browsers require for the
      // permission prompt to be allowed at all) — asking later, inside an
      // async function, is too late on some platforms.
      if (window.Notification && Notification.permission === 'default') {
        try { Notification.requestPermission(); } catch(e) {}
      }
      joinLine();
    });
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });
    baggerNumberInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });
    baggerNumberInput.addEventListener('input', () => {
      baggerNumberInput.value = baggerNumberInput.value.replace(/[^0-9]/g, '').slice(0, 3);
    });
    // leave button in topbar
    leaveBtn.addEventListener('click', ()=> showModal('Leave queue','Are you sure you want to leave?',[
      {label:'Cancel', onClick:()=>{}}, {label:'Leave', className:'btn primary', onClick: () => leaveQueueConfirmed()}]));
    avatarEl.addEventListener('click', showIconEditor);

    function updateMuteBtn(){
      muteBtn.textContent = soundMuted ? '🔕' : '🔔';
      muteBtn.title = soundMuted ? 'Unmute status alert sound' : 'Mute status alert sound';
    }
    updateMuteBtn();
    muteBtn.addEventListener('click', () => {
      soundMuted = !soundMuted;
      localStorage.setItem(LS_MUTE, String(soundMuted));
      updateMuteBtn();
    });

    toRegisterBtn.addEventListener('click', async ()=> {
      // only change our own entry
      const me = people[clientId]; if (!me) { gotoNameScreen(); return; }
      await moveMeToRegister();
    });
    toEndBtn.addEventListener('click', async ()=> {
      const me = people[clientId]; if (!me) { gotoNameScreen(); return; }
      await moveMeToEnd();
    });
    toBreakBtn.addEventListener('click', async ()=> {
      const me = people[clientId]; if (!me) { gotoNameScreen(); return; }
      await moveMeToBreak();
    });

    // Password gate
    // A browser only counts as authenticated if it has LS_AUTH=true AND its
    // saved auth version matches the current one from the DB. Admin bumping
    // siteStatus/authVersion changes the current value, so every previously-
    // authenticated browser stops matching — effectively logging everyone out
    // — without needing to touch each browser individually.
    function isLocallyAuthed(){
      if (localStorage.getItem(LS_AUTH) !== 'true') return false;
      const stored = localStorage.getItem(LS_AUTH_VERSION) || '0';
      const current = String(authVersion || 0);
      return stored === current;
    }
    function checkPasswordAndStart(){
      if (siteEnabled === false) { showClosedScreen(); return; }
      if (isLocallyAuthed()) {
        initialCheck();
      } else {
        passwordScreen.style.display = 'block';
      }
    }
    // Called when the admin bumps authVersion while this tab is already sitting
    // past the password screen — sends it back to the password screen live,
    // without touching the person's place in the queue itself.
    function forceReauth(){
      if (siteEnabled === false) return; // closed screen already takes priority
      if (passwordScreen.style.display === 'block') return; // already there
      nameScreen.style.display='none';
      queueScreen.style.display='none';
      topbar.style.display='none';
      bottomBar.style.display='none';
      passwordScreen.style.display='block';
    }
    passwordBtn.addEventListener('click', () => {
      const val = passwordInput.value;
      if (val === currentPassword) {
        localStorage.setItem(LS_AUTH, 'true');
        localStorage.setItem(LS_AUTH_VERSION, String(authVersion || 0));
        passwordScreen.style.display = 'none';
        passwordError.textContent = '';
        passwordInput.value = '';
        initialCheck();
      } else {
        passwordError.textContent = 'Incorrect password. Try again.';
      }
    });
    passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') passwordBtn.click(); });

    // Initial flow: if we have an existing DB entry for our clientId, go to queue, else show name screen
    async function initialCheck(){
      if (!db) { // firebase not initialized
        // show name screen so user can paste config later
        nameScreen.style.display='block';
        return;
      }
      const snap = await myDbRef().once('value');
      if (snap.exists()) { watchMe(); setupListeners(); showQueueScreen(); }
      else { nameScreen.style.display='block'; }
    }

    // Live "is the queue open" switch, controlled from the admin panel.
    // Missing/null is treated as open, so nothing changes until an admin
    // panel actually writes to this path for the first time.
    function handleSiteStatus(enabled){
      siteEnabled = enabled;
      enabledKnown = true;
      if (!siteEnabled) {
        showClosedScreen();
        appStarted = true;
        return;
      }
      if (!appStarted) {
        tryStart();
      } else if (closedScreen.style.display === 'block') {
        closedScreen.style.display = 'none';
        checkPasswordAndStart();
      }
    }

    // Live auth-version switch, controlled from the admin panel's
    // "Log everyone out" button. Only forces a tab back to the password
    // screen once we've actually seen the version change (not on first load),
    // and only if this tab isn't already correctly authenticated for it.
    function handleAuthVersion(newVersion){
      const changed = authVersionKnown && newVersion !== authVersion;
      authVersion = newVersion;
      authVersionKnown = true;
      if (!appStarted) { tryStart(); return; }
      if (changed && !isLocallyAuthed()) forceReauth();
    }

    // Live join-password switch, controlled from the admin panel. Missing
    // means the admin panel has never explicitly set one, so the built-in
    // default above is used.
    function handlePassword(pw){
      currentPassword = pw || 'bagger!';
      passwordKnown = true;
      if (!appStarted) tryStart();
    }

    // The very first screen shown depends on whether the queue is open, what
    // the current auth version is, and what the current password is — wait
    // until all three are known at least once before deciding, so a
    // slow-to-arrive value can't let a stale browser slip past the gate.
    function tryStart(){
      if (!enabledKnown || !authVersionKnown || !passwordKnown || appStarted) return;
      appStarted = true;
      checkPasswordAndStart();
    }

    // Periodic tasks
    setInterval(()=>{ try{ cleanupExpired(); }catch(e){} }, CLEANUP_INTERVAL);
    setInterval(updateCountdowns, COUNTDOWN_UPDATE);

    // start
    if (db) {
      db.ref('siteStatus/enabled').on('value', snap => {
        const val = snap.val();
        handleSiteStatus(val === false ? false : true);
      });
      db.ref('siteStatus/authVersion').on('value', snap => {
        handleAuthVersion(snap.val());
      });
      db.ref('siteStatus/password').on('value', snap => {
        handlePassword(snap.val());
      });
    } else {
      enabledKnown = true; authVersionKnown = true; passwordKnown = true;
      checkPasswordAndStart();
    }

  </script>
</body>
</html>
